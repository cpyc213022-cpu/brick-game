name: Deploy GitHub Pages

on:
  push:
    branches: ["main"]

# 👇 就是加入這一塊 👇
permissions:
  contents: read
  pages: write
  id-token: write
# 👆👆👆👆👆👆👆👆👆👆

jobs:
  build:
    # ... 你的打包步驟 ...
    
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
